name: Build AI Tech Updates APK

on:
  push:
    tags: ['aitech-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon -p android-ai-tech-updates assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-updates-android-apk
          path: android-ai-tech-updates/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/aitech-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-ai-tech-updates/app/build/outputs/apk/debug/app-debug.apk
